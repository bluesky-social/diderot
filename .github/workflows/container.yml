name: container-diderot
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # What image publishes.
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}

  # Every push to main publishes the image under its full commit SHA, to GHCR
  # and to Bluesky's ECR. The release build in release-please.yml adds the
  # version tag.
  image:
    if: github.event_name == 'push' && github.repository == 'bluesky-social/diderot'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # The ECR role trusts this repository's OIDC tokens for refs/heads/main
    # only. An `environment:` here would change the token's subject and the
    # role would refuse it.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/push-image
        with:
          aws-role-arn: ${{ secrets.AWS_ECR_ROLE_ARN }}
          version: ${{ github.sha }}
          tags: type=sha,format=long,prefix=

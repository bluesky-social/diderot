name: claude-mention

# Answers @claude on same-repository pull requests, for commenters with write
# access. The workflow, its hardening, and its trust model live in
# bluesky-social/.github.
#
# The mention job carries the model API key, and issue_comment runs in
# this repository with its secrets even when the comment is on a fork pull
# request. So a secretless gate job decides first, and the shared workflow
# (which repeats both checks) starts only when:
#   - the pull request's head repository is this one, read from the API
#     because an issue_comment payload does not carry it.
#   - the commenter or reviewer has write, maintain, or admin permission on
#     this repository, read from repos/{owner}/{repo}/collaborators/{user}/
#     permission. Organization members pass through their team's access,
#     whether their membership is public or private; an outside collaborator
#     passes only with write access or higher.
# The gate's GITHUB_TOKEN has pull-requests: read for the pull request lookup;
# the permission lookup needs only Metadata read, which that carries. An API
# error reading the permission counts as no access.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  gate:
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type == 'User' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.type == 'User' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Require a same-repository pull request and a writer
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.review.user.login }}
        run: |
          set -euo pipefail
          # An API error here fails this job, which skips the mention job.
          head_repo="$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.head.repo.full_name // ""')"
          # Fail closed: an API error reads as no access.
          permission="$(gh api "repos/${GH_REPO}/collaborators/${COMMENTER}/permission" --jq '.permission' || echo none)"
          allowed=false
          if [[ "${head_repo}" != "${GH_REPO}" ]]; then
            echo "::notice::#${PR} comes from ${head_repo:-a deleted fork}; @claude answers only on same-repository pull requests."
          elif [[ ! "${permission}" =~ ^(admin|maintain|write)$ ]]; then
            echo "::notice::${COMMENTER} has '${permission}' access; @claude answers only collaborators with write access."
          else
            allowed=true
          fi
          echo "allowed=${allowed}" >>"${GITHUB_OUTPUT}"

  mention:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    uses: bluesky-social/.github/.github/workflows/claude-mention.yml@v1
    permissions:
      contents: read
      pull-requests: write
      actions: read
    secrets:
      AGENT_GATEWAY_CLAUDE_GH_REVIEW_KEY: ${{ secrets.AGENT_GATEWAY_CLAUDE_GH_REVIEW_KEY }}
